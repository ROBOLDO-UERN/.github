name: 🐛 Relato de Bug / Falha de Hardware ou Software
description: Reportar um problema em qualquer subsistema do Roboldo (Orbit, IoT, Python, Flutter, Nextion ou Mecânica)
title: "[BUG] Descrição curta da falha"
labels: ["bug"]
body:
  - type: dropdown
    id: subsistema
    attributes:
      label: 🧩 Subsistema Afetado
      options:
        - "🌐 Orbit — Controlador Geral (Roboldo-Orbit)"
        - "🔌 IoT & Firmware C/C++ (Roboldo-IoT-Firmware)"
        - "🐍 Controlador Python (Controlador-Roboldo)"
        - "🧠 IA, Voz & Movimento Python (Roboldo-IA-Movimento)"
        - "🎮 Jogos Flutter & Lojinha (Roboldo-Base)"
        - "🖥️ Tela Nextion & Imagens (Roboldo-Display-Nextion)"
        - "⚙️ Mecânica & Elétrica (Roboldo-Hardware-CAD)"
    validations:
      required: true

  - type: textarea
    id: descricao
    attributes:
      label: 🔍 Descrição do Problema
      description: O que aconteceu vs. o que era esperado?
    validations:
      required: true

  - type: textarea
    id: passos
    attributes:
      label: 🔄 Passos para Reproduzir / Logs
      description: Comandos executados, porta serial, placa utilizada ou logs de erro.
    validations:
      required: true
