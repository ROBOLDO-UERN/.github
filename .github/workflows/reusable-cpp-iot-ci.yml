name: Reusable IoT & C/C++ Firmware CI (ROBOLDO-UERN)

on:
  workflow_call:

jobs:
  firmware-qa:
    name: C/C++ Static Analysis & PlatformIO Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python & PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Cppcheck e PlatformIO Core
        run: |
          sudo apt-get update && sudo apt-get install -y cppcheck
          pip install --upgrade platformio

      - name: Análise Estática C/C++ (Cppcheck)
        run: |
          cppcheck --enable=warning,performance,portability --error-exitcode=0 --inline-suppr src/ include/ 2>/dev/null || true

      - name: Compilar Firmware (PlatformIO)
        run: |
          if [ -f platformio.ini ]; then
            pio run
          else
            echo "platformio.ini não encontrado na raiz; análise estática C/C++ concluída."
          fi
