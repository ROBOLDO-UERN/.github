name: Reusable Python CI (ROBOLDO-UERN)

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Versão do Python para execução'
        required: false
        type: string
        default: '3.11'

jobs:
  python-qa:
    name: Python Lint, Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Instalar ferramentas de análise e dependências
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Verificar sintaxe Python (Compile Check)
        run: python -m compileall -q .

      - name: Executar Linter (Ruff)
        run: ruff check . --select=E9,F63,F7,F82 --show-source

      - name: Executar Testes Automatizados (Pytest)
        run: |
          if [ -d tests ] || ls test_*.py *_test.py 1> /dev/null 2>&1; then
            pytest
          else
            echo "Nenhum teste unitário encontrado; validação de sintaxe concluída com sucesso."
          fi
